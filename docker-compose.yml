version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: driveguard_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-driveguard_root_pass}
      MYSQL_DATABASE: ${MYSQL_DB:-driveguard_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: driveguard_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-driveguard_root_pass}
      MYSQL_DB: ${MYSQL_DB:-driveguard_db}
      PORT: 8000
    ports:
      - "8000:8000"

volumes:
  mysql_data:
